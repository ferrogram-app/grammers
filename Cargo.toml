[workspace]
members = [
    "mtg-client",
    "mtg-crypto",
    "mtg-mtproto",
    "mtg-mtsender",
    "mtg-session",
    "mtg-tl-gen",
    "mtg-tl-parser",
    "mtg-tl-types",
]
resolver = "2"

[workspace.dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "std"] }

# Dependencies are compiled once and cached, but run in every test: big-number and prime
# checks are ~20x slower unoptimized. Workspace crates stay at opt-level 0 for fast rebuilds.
[profile.dev.package."*"]
opt-level = 3

# Smaller target dir and faster linking/caching; backtraces keep line numbers.
[profile.dev]
debug = "line-tables-only"
