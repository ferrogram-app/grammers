[workspace]
members = [
    "mtg",
    "mtg-client",
    "mtg-crypto",
    "mtg-mtproto",
    "mtg-mtsender",
    "mtg-session",
    "mtg-tl-gen",
    "mtg-tl-parser",
    "mtg-tl-types",
]
resolver = "2"

[workspace.dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "std"] }
