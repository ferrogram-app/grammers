[package]
name = "mtg-mtproto"
version = "0.12.0"
authors = ["Lonami Exo <totufals@hotmail.com>"]
license = "MIT OR Apache-2.0"
description = """
An implementation of the Mobile Transport Protocol.
"""
homepage = "https://codeberg.org/Lonami/grammers"
documentation = "https://docs.rs/grammers-mtproto"
repository = "https://codeberg.org/Lonami/grammers"
keywords = ["mtproto", "telegram", "tl"]
categories = ["network-programming"]
edition = "2024"

[dependencies]
crc32fast = "1.5.4"
flate2 = "1.1.11"
getrandom = "0.4.3"
mtg-crypto = { path = "../mtg-crypto", version = "0.12.0" }
mtg-tl-types = { path = "../mtg-tl-types", version = "0.12.0", features = ["tl-mtproto"] }
num-bigint = "0.5"
sha1 = "0.11.0"
tracing.workspace = true

[dev-dependencies]
toml = "1.2.1"
