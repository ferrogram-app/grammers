[package]
name = "mtg-mtsender"
version = "0.12.0"
authors = ["Lonami Exo <totufals@hotmail.com>"]
license = "MIT OR Apache-2.0"
description = """
A sender implementation using the Mobile Transport Protocol.
"""
homepage = "https://github.com/ferrogram-app/mtg"
repository = "https://github.com/ferrogram-app/mtg"
keywords = ["api", "mtproto", "telegram", "tl"]
categories = ["api-bindings", "network-programming"]
edition = "2024"

[features]
proxy = ["tokio-socks", "hickory-resolver", "url"]

[dependencies]
bytes = "1.12.1"
mtg-mtproto = { path = "../mtg-mtproto", version = "0.12.0" }
mtg-session = { path = "../mtg-session", version = "0.12.0", default-features = false }
mtg-tl-types = { path = "../mtg-tl-types", version = "0.12.0", features = [ "tl-mtproto", "deserializable-functions" ] }
locate-locale = "0.2.0"
os_info = { version = "3.15.0", default-features = false }
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "sync", "time", "net", "macros", "rt"] }
tracing.workspace = true

tokio-socks = { version = "0.5.3", optional = true }
hickory-resolver = { version = "0.26.3", optional = true }
url = { version = "2.5.8", optional = true }

[dev-dependencies]
toml = "1.2.1"
socks5-server = "0.10.1"
tracing-subscriber.workspace = true
